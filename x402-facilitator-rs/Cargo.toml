[package]
name = "x402-facilitator"
version = "1.0.0"
edition = "2021"
description = "Fast, Reliable, and Cheap X402 Facilitator"
authors = ["x402 Team"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "signal"] }

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "limit", "compression-gzip", "request-id"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono"] }

# Redis
deadpool-redis = "0.15"
redis = { version = "0.25", features = ["tokio-comp"] }

# Ethereum/Blockchain
alloy = { version = "0.5", features = ["full", "signers", "signer-local", "providers", "contract", "sol-types", "json-rpc", "transport-ws", "reqwest-rustls-tls"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# TLS (for WebSocket)
rustls = { version = "0.23", features = ["aws_lc_rs"] }

# Rate limiting
governor = "0.6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Config & Environment
dotenvy = "0.15"
toml = "0.8"

# Crypto
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Password hashing
bcrypt = "0.15"

# Random number generation
rand = "0.8"

# Utilities
once_cell = "1"
parking_lot = "0.12"
dashmap = "6"
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
async-trait = "0.1"
regex = "1"

# Metrics (Prometheus)
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# WebSocket support for alloy providers
alloy-transport-ws = "0.5"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-native-roots"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
