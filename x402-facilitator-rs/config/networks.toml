# x402 Facilitator - Network & Token Configuration
# This file allows adding new networks and tokens without code changes
# Simply update this file and restart the service

[settings]
# Default gas buffer percentage for all networks
default_gas_buffer_percent = 20
# Default settlement timeout in milliseconds
default_settlement_timeout_ms = 60000
# Default transaction timeout in milliseconds
default_transaction_timeout_ms = 300000

# =============================================================================
# MAINNET NETWORKS
# =============================================================================

[[networks]]
name = "Base"
chain_id = 8453
network_type = "evm"
environment = "mainnet"
rpc_url_env = "BASE_RPC"
rpc_url_default = "wss://base-mainnet.g.alchemy.com/v2/demo"
explorer_url = "https://basescan.org"
flashblock_enabled = true
# Credit cost per settlement on this network
credit_cost = 1
# Gas settings
gas_limit = 200000
gas_buffer_percent = 20
# Native token for gas
native_symbol = "ETH"
native_name = "Ethereum"
native_decimals = 18
native_cmc_slug = "ethereum"

[[networks.tokens]]
symbol = "USDC"
name = "USD Coin"
address = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
decimals = 6
transfer_type = "erc3009"
# EIP-712 domain for signature verification
eip712_name = "USD Coin"
eip712_version = "2"
# Forwarder contract address (deploy and set this)
forwarder_address = ""
enabled = true

